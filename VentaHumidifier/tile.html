<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--ok:#2ecc71;--warn:#f39c12;--bad:#e74c3c;--blue:#5ec8e5;--grey:#8a96a3;--acc:#2a9d8f}
.vt{--fg:#e8edf2;--sub:#9aa5b1;--box:rgba(255,255,255,.045);--line:rgba(255,255,255,.08);--track:rgba(255,255,255,.1)}
.vt.vl{--fg:#1f2933;--sub:#5b6672;--box:rgba(0,0,0,.035);--line:rgba(0,0,0,.08);--track:rgba(0,0,0,.08)}
html,body{margin:0!important;height:100%;background:transparent;overflow:hidden}
*{box-sizing:border-box}
/* all sizes in em: the font grows with the tile */
.vt{height:100%;container-type:size;color:var(--fg);font-family:"Segoe UI",Roboto,Arial,sans-serif}
/* top space for the tile title of the visualization; content spreads over the full height */
.in{height:100%;display:flex;flex-direction:column;justify-content:space-between;gap:.3em;padding:42px 4px 2px;font-size:clamp(11px,min(3cqw,3.9cqh),20px);line-height:1.25;overflow:hidden}
.hd{display:flex;align-items:center;gap:.5em;font-weight:600}
.hd i{width:.6em;height:.6em;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 .22em color-mix(in srgb,var(--c) 25%,transparent)}
.hd span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd em{margin-left:auto;font-style:normal;font-size:.75em;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:1em;padding:.1em .7em;white-space:nowrap}
.big{display:flex;align-items:baseline;gap:.5em}.big b{font-size:2.6em;font-weight:700;line-height:1;color:var(--h)}.big span{color:var(--sub);font-size:.85em}
.mi div,.sg,button{border-radius:9px}
.mi{display:grid;grid-template-columns:repeat(auto-fit,minmax(5.5em,1fr));gap:.35em}
.mi div{display:flex;flex-direction:column;background:var(--box);border-radius:8px;padding:.3em .55em;min-width:0}
.mi span{color:var(--sub);font-size:max(11px,.72em);white-space:nowrap}.mi b{font-size:1.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct{display:flex;flex-wrap:wrap;gap:.35em;align-items:center}
.sg{display:flex;flex:1 1 100%;background:var(--box);border-radius:9px;padding:2px;gap:2px}.sg.zg{flex:1 1 auto}
button{font:inherit;font-size:.82em;color:var(--fg);background:var(--box);border:1px solid var(--line);border-radius:7px;padding:.3em .7em;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
button:hover{background:var(--track)}
.sg button{flex:1;border:0;background:transparent;padding:.35em .2em}
button.on{background:var(--acc);color:#fff;font-weight:600}button.ask{color:var(--warn);border-color:var(--warn)}
.lb{color:var(--sub);font-size:.82em;padding:.35em .6em;flex:none}
.dis{opacity:.4;pointer-events:none}
.bar{display:grid;grid-template-columns:6.5em 1fr auto;align-items:center;gap:.5em;font-size:.82em}.bar span{color:var(--sub)}
.tr{height:.5em;border-radius:.25em;background:var(--track);overflow:hidden}.tr i{display:block;height:100%;border-radius:.25em;background:var(--c)}
.gr{font-size:max(11px,.75em);color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{display:flex;flex-direction:column;gap:.35em}
</style>
</head>
<body>
<div class="vt" id="vt"><div class="in" id="in"></div></div>
<script>
// D: tile data of the module (see TileData() in module.php); updates arrive via handleMessage
let D = /*__DATA__*/null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const T = k => (D.t && D.t[k]) || k;
const act = (ident, value) => { if (typeof requestAction === 'function') requestAction(ident, value); };
const num = (v, d, u) => v === null || v === undefined ? '–' : Number(v).toLocaleString(undefined, {minimumFractionDigits: d, maximumFractionDigits: d}) + u;
const time = ts => { const x = new Date(ts * 1000); return x.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}); };
const date = ts => { const x = new Date(ts * 1000); return x.toLocaleDateString() + ' ' + time(ts); };
const btn = (attrs, text, on) => '<button ' + attrs + (on ? ' class="on"' : '') + '>' + esc(text) + '</button>';

function bar(title, share, color, text) {
  const p = Math.max(0, Math.min(100, Math.round(share * 100)));
  return '<div class="bar" style="--c:' + color + '"><span>' + esc(title) + '</span><div class="tr"><i style="width:' + p + '%"></i></div><b>' + esc(text) + '</b></div>';
}

function render() {
  if (!D) return;
  const on = D.online;
  const color = !on ? 'var(--bad)' : (D.shortage ? 'var(--warn)' : (D.mode > 0 ? 'var(--ok)' : 'var(--grey)'));
  const room = on ? D.room : null;
  const hc = room === null ? 'var(--grey)' : (room < 35 ? 'var(--warn)' : (room > 60 ? 'var(--bad)' : 'var(--ok)'));
  let h = '<div class="hd" style="--c:' + color + '"><i></i><span>' + esc(on ? T('Online') + ' · ' + T('Updated') + ' ' + time(D.last) : T('Offline'))
    + '</span><em>' + esc(D.status || T('Offline')) + '</em></div>';
  h += '<div class="big" style="--h:' + hc + '"><b>' + num(room, 0, ' %') + '</b><span>' + esc(T('Room humidity')) + (on ? ' · ' + esc(T('Target')) + ' ' + D.target + ' %' : '') + '</span></div>';
  h += '<div class="mi"><div><span>' + esc(T('Temperature')) + '</span><b>' + (on ? num(D.temperature, 1, ' °C') : '–') + '</b></div>'
    + '<div><span>' + esc(T('Humidity at the device')) + '</span><b>' + (on ? num(D.device, 0, ' %') : '–') + '</b></div>'
    + '<div><span>' + esc(T('Fan')) + '</span><b>' + (on && D.mode > 0 && D.fan !== null ? esc(T('Level')) + ' ' + D.fan : '–') + '</b></div>'
    + (D.dust !== null && D.dust !== undefined ? '<div><span>' + esc(T('PM2.5')) + '</span><b>' + (on ? D.dust + ' µg/m³' : '–') + '</b></div>' : '') + '</div>';
  // operation
  let sg = '';
  [[0, 'Off'], [1, 'Auto'], [2, 'Sleep'], [3, '1'], [4, '2'], [5, '3']].forEach(([m, t]) => { sg += btn('data-mode="' + m + '"', T(t), on && D.mode === m); });
  let zg = '<span class="lb">' + esc(T('Target')) + '</span>';
  [40, 45, 50, 55].forEach(z => { zg += btn('data-target="' + z + '"', z + ' %', on && D.target === z); });
  h += '<div class="ct' + (on ? '' : ' dis') + '"><div class="sg">' + sg + '</div><div class="sg zg">' + zg + '</div>'
    + btn('data-auto="1"', T('Automation'), D.auto) + (D.led === null ? '' : btn('data-led="1"', T('LED'), !!D.led)) + '</div>';
  // water and maintenance
  let m = '';
  if (D.water !== null && D.tank > 0) m += bar(T('Water'), on ? D.water / D.tank : 0, D.shortage ? 'var(--warn)' : 'var(--blue)', on ? num(D.water, 1, ' l') : '–');
  else m += '<div class="bar" style="--c:var(--blue)"><span>' + esc(T('Water')) + '</span><b style="grid-column:2/4">' + esc(!on ? '–' : (D.shortage ? T('refill') : (D.stageText || '–'))) + '</b></div>';
  const mc = (r, warn) => r <= 0 ? 'var(--bad)' : (r <= warn ? 'var(--warn)' : 'var(--ok)');
  m += bar(T('Hygiene disc'), D.disc / Math.max(1, D.discInterval), mc(D.disc, 7), D.disc <= 0 ? T('due') : D.disc + ' ' + T('days'));
  m += bar(T('Cleaning'), D.cleaning / Math.max(1, D.cleaningInterval), mc(D.cleaning, 1), D.cleaning <= 0 ? T('due') : D.cleaning + ' ' + T('days'));
  m += '<div class="ct">' + btn('data-reset="ResetCleaning"', T('Cleaned')) + btn('data-reset="ResetDisc"', T('Disc changed')) + '</div>';
  h += '<div class="mt">' + m + '</div>';
  const warn = on && D.warnings && D.warnings !== T('none') ? T('Warnings') + ': ' + D.warnings + ' · ' : '';
  h += '<div class="gr">' + esc(D.kind) + ' · ' + esc(warn) + esc(on ? D.reason : T('last reached') + ' ' + (D.last > 0 ? date(D.last) : T('never'))) + '</div>';
  $('in').innerHTML = h;
}

// Design: automatic follows the card/text colors of the tile visualization, otherwise prefers-color-scheme
function theme() {
  const vt = $('vt');
  if (D.theme === 1) { vt.classList.remove('vl'); return; }
  if (D.theme === 2) { vt.classList.add('vl'); return; }
  const s = getComputedStyle(document.documentElement);
  const lum = n => { let v = s.getPropertyValue(n).replace(/[^0-9a-f]/gi, ''); if (v.length < 6) return -1;
    v = v.length === 8 && /^ff/i.test(v) ? v.slice(2) : v.slice(0, 6); const c = parseInt(v, 16); return 0.299 * (c >> 16) + 0.587 * (c >> 8 & 255) + 0.114 * (c & 255); };
  const b = lum('--card-color'), f = lum('--content-color');
  vt.classList.toggle('vl', b < 0 ? matchMedia('(prefers-color-scheme: light)').matches : b >= (f < 0 ? 128 : f));
}

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.mode) { D.mode = parseInt(b.dataset.mode, 10); render(); act('Mode', D.mode); }
  else if (b.dataset.target) { D.target = parseInt(b.dataset.target, 10); render(); act('TargetHumidity', D.target); }
  else if (b.dataset.auto) { D.auto = !D.auto; render(); act('Automatic', D.auto); }
  else if (b.dataset.led) { D.led = !D.led; render(); act('LED', D.led); }
  else if (b.dataset.reset) {
    // two steps against accidental taps: "Sure?" for 4 s, then reset
    if (b.classList.contains('ask')) { act(b.dataset.reset, true); }
    else { const text = b.textContent; b.classList.add('ask'); b.textContent = T('Sure?'); setTimeout(() => { b.classList.remove('ask'); b.textContent = text; }, 4000); }
  }
});

function handleMessage(data) {
  D = typeof data === 'string' ? JSON.parse(data) : data;
  theme(); render();
}

if (D) { theme(); render(); }
</script>
</body>
</html>
