<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--ok:#2ecc71;--warn:#f39c12;--bad:#e74c3c;--blue:#5ec8e5;--grey:#8a96a3;--acc:#2a9d8f}
.vt{--fg:#e8edf2;--sub:#9aa5b1;--box:rgba(255,255,255,.045);--line:rgba(255,255,255,.08);--track:rgba(255,255,255,.1)}
.vt.vl{--fg:#1f2933;--sub:#5b6672;--box:rgba(0,0,0,.035);--line:rgba(0,0,0,.08);--track:rgba(0,0,0,.08)}
html,body{margin:0!important;height:100%;background:transparent;overflow:hidden}
*{box-sizing:border-box}
/* main tile: season on the left (or top), all devices on the right (or below); sizes in em grow with the tile */
.vt{height:100%;container-type:size;color:var(--fg);font-family:"Segoe UI",Roboto,Arial,sans-serif}
/* top space for the tile title of the visualization */
.in{height:100%;display:grid;grid-template-columns:minmax(15em,30%) 1fr;gap:.9em;padding:44px 14px 10px;font-size:clamp(12px,min(1.5cqw,3.4cqh),19px);line-height:1.3;overflow:hidden}
.col{display:flex;flex-direction:column;gap:.45em;min-height:0;min-width:0}
.hd{display:flex;align-items:center;gap:.5em;font-weight:600}
.hd i{width:.6em;height:.6em;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 .22em color-mix(in srgb,var(--c) 25%,transparent)}
.hd em{margin-left:auto;font-style:normal;font-size:.75em;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:1em;padding:.1em .7em;white-space:nowrap}
.ck{display:flex;flex-direction:column;gap:.3em;font-size:.85em}
.ck div{display:flex;gap:.5em;align-items:center;background:var(--box);border-radius:8px;padding:.3em .55em}
.ck i{width:.55em;height:.55em;border-radius:50%;background:var(--c);flex:none}.ck b{margin-left:auto;font-weight:600;white-space:nowrap}
button{font:inherit;font-size:.82em;color:var(--fg);background:var(--box);border:1px solid var(--line);border-radius:7px;padding:.3em .8em;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
button:hover{background:var(--track)}
button.on{background:var(--acc);color:#fff;font-weight:600}button.ask{color:var(--warn);border-color:var(--warn)}
.gr{font-size:max(11px,.75em);color:var(--sub)}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(17em,1fr));gap:.5em;align-content:start;overflow:auto;min-height:0}
.dv{background:var(--box);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:10px;padding:.45em .65em;display:flex;flex-direction:column;gap:.3em;min-width:0}
.dn{display:flex;align-items:baseline;gap:.5em}.dn b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dn span{margin-left:auto;font-size:.75em;color:var(--sub);white-space:nowrap}
.dh{display:flex;align-items:baseline;gap:.5em}.dh b{font-size:1.7em;font-weight:700;line-height:1.05;color:var(--h)}.dh span{font-size:.8em;color:var(--sub)}
.sg{display:flex;background:var(--box);border-radius:8px;padding:2px;gap:2px}.sg button{flex:1;border:0;background:transparent;padding:.3em .2em}
.sg button.on{background:var(--acc)}
.cp{display:flex;flex-wrap:wrap;gap:.3em}.cp span{font-size:.72em;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:1em;padding:.1em .55em;white-space:nowrap}
.dis{opacity:.45;pointer-events:none}
.hb{position:relative;height:.45em;border-radius:.25em;background:var(--track);margin:.1em 0 .15em}
.hb i{position:absolute;left:0;top:0;bottom:0;border-radius:.25em}.hb .cf{position:absolute;left:40%;width:20%;top:0;bottom:0;background:color-mix(in srgb,var(--ok) 22%,transparent)}
.hb b{position:absolute;top:-.25em;width:.2em;height:.95em;margin-left:-.1em;border-radius:.1em;background:var(--fg)}
.dv{background:linear-gradient(160deg,var(--box),transparent)}
/* 1.12: one humidity chart per room, side by side (room sensor = main line, device = thin dashed line) */
.cs{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(12em,1fr));gap:.5em}
.cc{background:var(--box);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;padding:.4em .55em .3em;display:flex;flex-direction:column;min-width:0;min-height:9em}
.ct{display:flex;align-items:baseline;gap:.4em;min-width:0}.ct b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct span{margin-left:auto;font-size:1.5em;font-weight:700;color:var(--c);white-space:nowrap;line-height:1}
.cl{display:flex;gap:.8em;font-size:.72em;color:var(--sub);white-space:nowrap;overflow:hidden}.cl i{display:inline-block;width:1.1em;height:0;border-top:2px solid var(--c);vertical-align:middle;margin-right:.3em}
.cl i.dd{border-top:1.5px dashed var(--sub)}
.ch{flex:1;min-height:5em;position:relative}.ch svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ch text{fill:var(--sub);font-size:10px}.ch .gl{stroke:var(--line)}.ch .cb{fill:color-mix(in srgb,var(--ok) 10%,transparent)}
.ch .tl{stroke:var(--fg);stroke-dasharray:4 4;opacity:.4}.ch path{fill:none;stroke-linejoin:round;stroke-linecap:round}
.ch path.r{stroke-width:2.2}.ch path.d{stroke:var(--sub);stroke-width:1.3;stroke-dasharray:3 3;opacity:.8}
/* main switch sits in the header row */
.hd button{margin-left:auto;font-weight:600}.hd em+button{margin-left:.4em}
/* narrow tiles: season on top, devices below; conditions in two columns (must follow the base rules) */
@container (max-width:1000px){.in{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:.6em;overflow:auto;font-size:clamp(12px,min(2.3cqw,4cqh),17px)}
.ck{display:grid;grid-template-columns:1fr 1fr;gap:.3em}.ck div{padding:.2em .55em}.col{gap:.35em}}
</style>
</head>
<body>
<div class="vt" id="vt"><div class="in" id="in"></div></div>
<script>
let D = /*__DATA__*/null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const T = k => (D.t && D.t[k]) || k;
const act = (ident, value) => { if (typeof requestAction === 'function') requestAction(ident, value); };
const row = (ok, text, value) => '<div style="--c:' + (ok ? 'var(--ok)' : 'var(--grey)') + '"><i></i><span>' + esc(text) + '</span><b>' + esc(value) + '</b></div>';
const chip = (color, text) => '<span style="--c:' + color + '">' + esc(text) + '</span>';

function season() {
  const color = !D.active ? 'var(--grey)' : (D.season ? 'var(--blue)' : 'var(--grey)');
  // header row: state badge only while active, main switch on the right (was a separate row before)
  let h = '<div class="hd" style="--c:' + color + '"><i></i><span>' + esc(T('Automation')) + '</span>'
    + (D.active ? '<em>' + esc(D.season ? T('Heating season') : T('Pause')) + '</em>' : '')
    + '<button id="main"' + (D.active ? ' class="on"' : '') + '>' + esc(D.active ? T('ON') : T('OFF')) + '</button></div>';
  h += '<div class="ck">'
    + row(D.winter, T('Heating'), D.winterConfigured ? (D.winter ? T('Winter') : T('Summer')) : T('not configured'))
    + row(D.tempOk, T('Outdoor 24 h mean') + ' (< ' + D.start + ' °C)', D.outdoor === null ? T('not configured') : D.outdoor.toLocaleString(undefined, {minimumFractionDigits: 1, maximumFractionDigits: 1}) + ' °C')
    + row(D.ventilation, T('Ventilation running'), D.ventText === null ? T('not configured') : (D.ventText === 'ON' || D.ventText === 'OFF' ? T(D.ventText) : D.ventText))
    + row(D.presence, T('Somebody at home'), D.presenceConfigured ? (D.presence ? T('yes') : T('no')) : T('not configured'))
    + row(true, D.day ? T('Day – automatic') : T('Night – sleep mode'), T('Target') + ' ' + D.target + ' %')
    + '</div>';
  h += '<div class="gr">' + esc(D.reason) + ' · ' + esc(T('Off from')) + ' ' + D.humidityOff + ' %</div>';
  return '<div class="col">' + h + '</div>';
}

const num = v => v !== null && v !== undefined && v > 0 && v < 100;
const humColor = v => !num(v) ? 'var(--grey)' : (v < 35 ? 'var(--warn)' : (v > 60 ? 'var(--bad)' : 'var(--ok)'));
// "Lounge – Venta LPH60" -> "Lounge" (the chart is about the room)
const roomName = n => String(n || '').split(' – ')[0];

/* per device: room series (sensor, priority) and device series, each with the current value appended */
function seriesOf(d, now, t0) {
  const h = (D.history || {})[String(d.id)] || {};
  const r = (Array.isArray(h) ? h : (h.r || [])).filter(p => p[0] >= t0);
  const dv = (Array.isArray(h) ? [] : (h.d || [])).filter(p => p[0] >= t0);
  const room = num(d.room) ? d.room : (num(d.humidity) ? d.humidity : null);
  if (room !== null) r.push([now, room]);
  if (num(d.device)) dv.push([now, d.device]);
  return {r, d: dv, room};
}

/* one card per room with header and an empty chart box; the SVG is drawn in charts() at the real pixel size */
function cards() {
  return '<div class="cs">' + (D.devices || []).map((d, i) => {
    const room = num(d.room) ? d.room : (num(d.humidity) ? d.humidity : null);
    return '<div class="cc" style="--c:' + humColor(room) + '"><div class="ct"><b>' + esc(roomName(d.name)) + '</b><span>'
      + (room === null ? '–' : Math.round(room) + ' %') + '</span></div>'
      + '<div class="cl"><span><i></i>' + esc(T('Room')) + '</span>' + (d.dehum ? '' : '<span><i class="dd"></i>' + esc(T('Device'))
      + (num(d.device) ? ' ' + Math.round(d.device) + ' %' : '') + '</span>') + '<span>' + esc(d.online ? (d.status || '') : T('Offline')) + '</span></div>'
      + '<div class="ch" data-i="' + i + '"></div></div>';
  }).join('') + '</div>';
}

/* draws all charts with a common scale so that the rooms can be compared */
function charts() {
  const boxes = document.querySelectorAll('.ch[data-i]');
  if (!boxes.length) return;
  const now = D.now || Math.floor(Date.now() / 1000), t0 = now - 86400;
  const all = (D.devices || []).map(d => seriesOf(d, now, t0));
  const vals = all.flatMap(s => s.r.concat(s.d).map(p => p[1]));
  let lo = Math.min(35, ...vals, D.target || 50), hi = Math.max(65, ...vals, D.target || 50);
  lo = Math.floor((lo - 2) / 10) * 10; hi = Math.ceil((hi + 2) / 10) * 10;
  boxes.forEach(box => {
    const sr = all[parseInt(box.dataset.i, 10)];
    const W = box.clientWidth, H = box.clientHeight;
    if (!sr || W < 50 || H < 30) return;
    const L = 22, R = 4, TP = 4, B = 14, pw = W - L - R, ph = H - TP - B;
    const x = t => L + (t - t0) / 86400 * pw, y = v => TP + (hi - v) / (hi - lo) * ph;
    let s = '<rect class="cb" x="' + L + '" width="' + pw + '" y="' + y(Math.min(60, hi)) + '" height="' + Math.max(0, y(Math.max(40, lo)) - y(Math.min(60, hi))) + '"/>';
    for (let v = lo; v <= hi; v += 10) {
      s += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (L - 3) + '" y="' + (y(v) + 3) + '" text-anchor="end">' + v + '</text>';
    }
    for (let t = Math.ceil(t0 / 3600) * 3600; t <= now; t += 3600) {
      const h = new Date(t * 1000).getHours();
      if (h % 6 === 0) s += '<line class="gl" x1="' + x(t) + '" x2="' + x(t) + '" y1="' + TP + '" y2="' + (TP + ph) + '"/><text x="' + x(t) + '" y="' + (H - 2) + '" text-anchor="middle">' + String(h).padStart(2, '0') + '</text>';
    }
    if (D.target > 0) s += '<line class="tl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(D.target) + '" y2="' + y(D.target) + '"/>';
    const path = (pts, cls, color) => {
      let d = '', prev = null;
      // gap > 20 min (offline, no data) -> new line segment
      pts.forEach(p => { d += (prev === null || p[0] - prev > 1200 ? 'M' : 'L') + x(p[0]).toFixed(1) + ' ' + y(p[1]).toFixed(1); prev = p[0]; });
      return d ? '<path class="' + cls + '" d="' + d + '"' + (color ? ' stroke="' + color + '"' : '') + '/>' : '';
    };
    s += path(sr.d, 'd', '') + path(sr.r, 'r', getComputedStyle(box).getPropertyValue('--c').trim() || '#5ec8e5');
    if (!sr.r.length && !sr.d.length) s += '<text x="' + (L + pw / 2) + '" y="' + (TP + ph / 2) + '" text-anchor="middle">' + esc(T('no history yet')) + '</text>';
    box.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '">' + s + '</svg>';
  });
}

function render() {
  if (!D) return;
  const has = (D.devices || []).length > 0;
  $('in').innerHTML = season() + '<div class="col"><div class="hd" style="--c:var(--acc)"><i></i><span>' + esc(T('Room humidity – last 24 h')) + '</span>'
    + (D.target > 0 ? '<em style="--c:var(--grey)">' + esc(T('Target')) + ' ' + D.target + ' %</em>' : '') + '</div>'
    + (has ? cards() : '<div class="gr">' + esc(T('no devices – add them in the instance configuration')) + '</div>') + '</div>';
  charts();
}
new ResizeObserver(() => charts()).observe(document.getElementById('in'));

function theme() {
  const vt = $('vt');
  if (D.theme === 1) { vt.classList.remove('vl'); return; }
  if (D.theme === 2) { vt.classList.add('vl'); return; }
  const s = getComputedStyle(document.documentElement);
  const lum = n => { let v = s.getPropertyValue(n).replace(/[^0-9a-f]/gi, ''); if (v.length < 6) return -1;
    v = v.length === 8 && /^ff/i.test(v) ? v.slice(2) : v.slice(0, 6); const c = parseInt(v, 16); return 0.299 * (c >> 16) + 0.587 * (c >> 8 & 255) + 0.114 * (c & 255); };
  const b = lum('--card-color'), f = lum('--content-color');
  vt.classList.toggle('vl', b < 0 ? matchMedia('(prefers-color-scheme: light)').matches : b >= (f < 0 ? 128 : f));
}

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.id) {
    const d = D.devices.find(x => String(x.id) === b.dataset.id);
    if (d) { d.mode = parseInt(b.dataset.mode, 10); render(); }
    act('DeviceMode', JSON.stringify({id: parseInt(b.dataset.id, 10), mode: parseInt(b.dataset.mode, 10)}));
    return;
  }
  if (b.id !== 'main') return;
  // switching ON switches the devices automatically -> two steps
  if (!D.active && !b.classList.contains('ask')) {
    const text = b.textContent; b.classList.add('ask'); b.textContent = T('Sure?');
    setTimeout(() => { b.classList.remove('ask'); b.textContent = text; }, 4000);
    return;
  }
  D.active = !D.active; render(); act('Active', D.active);
});

function handleMessage(data) { D = typeof data === 'string' ? JSON.parse(data) : data; theme(); render(); }
if (D) { theme(); render(); }
</script>
</body>
</html>
