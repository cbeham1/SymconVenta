<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--ok:#2ecc71;--warn:#f39c12;--grey:#8a96a3;--acc:#2a9d8f;--blue:#5ec8e5}
.vt{--fg:#e8edf2;--sub:#9aa5b1;--box:rgba(255,255,255,.045);--line:rgba(255,255,255,.08)}
.vt.vl{--fg:#1f2933;--sub:#5b6672;--box:rgba(0,0,0,.035);--line:rgba(0,0,0,.08)}
html,body{margin:0!important;height:100%;background:transparent;overflow:hidden}
*{box-sizing:border-box}
.vt{height:100%;container-type:size;color:var(--fg);font-family:"Segoe UI",Roboto,Arial,sans-serif}
.in{height:100%;display:flex;flex-direction:column;justify-content:space-between;gap:.5em;padding:42px 4px 2px;font-size:clamp(12px,min(5cqw,8cqh),18px);line-height:1.25;overflow:hidden}
.hd{display:flex;align-items:center;gap:.5em;font-weight:600}
.hd i{width:.6em;height:.6em;border-radius:50%;background:var(--c);flex:none}
.hd em{margin-left:auto;font-style:normal;font-size:.75em;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:1em;padding:.1em .7em}
.big{display:flex;align-items:baseline;gap:.5em}.big b{font-size:2.4em;font-weight:700;line-height:1.05}.big span{color:var(--sub);font-size:.85em}
.ct{display:flex;gap:.35em;flex-wrap:wrap}
button{font:inherit;font-size:.85em;color:var(--fg);background:var(--box);border:1px solid var(--line);border-radius:7px;padding:.35em .9em;cursor:pointer}
button.on{background:var(--acc);color:#fff;font-weight:600}
.gr{margin-top:auto;font-size:max(11px,.75em);color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="vt" id="vt"><div class="in" id="in"></div></div>
<script>
let D = /*__DATA__*/null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const T = k => (D.t && D.t[k]) || k;
const act = (ident, value) => { if (typeof requestAction === 'function') requestAction(ident, value); };
function render() {
  if (!D) return;
  const c = D.tankFull ? 'var(--warn)' : (D.on ? 'var(--ok)' : 'var(--grey)');
  let h = '<div class="hd" style="--c:' + c + '"><i></i><span>' + esc(T('Dehumidifier')) + '</span><em>' + esc(D.status) + '</em></div>';
  h += '<div class="big"><b>' + (D.hasHumidity && D.humidity !== null ? Math.round(D.humidity) + ' %' : '–') + '</b><span>' + esc(T('Room humidity'))
    + (D.target > 0 ? ' · ' + esc(T('Target')) + ' ' + D.target + ' %' : '') + '</span></div>';
  h += '<div class="ct"><button data-p="1"' + (D.on ? ' class="on"' : '') + '>' + esc(T('On')) + '</button><button data-p="0"' + (!D.on ? ' class="on"' : '') + '>'
    + esc(T('Off')) + '</button><button data-a="1"' + (D.auto ? ' class="on"' : '') + '>' + esc(T('Automation')) + '</button></div>';
  h += '<div class="gr">' + esc(D.reason) + '</div>';
  $('in').innerHTML = h;
}
function theme() {
  const vt = $('vt');
  if (D.theme === 1) { vt.classList.remove('vl'); return; }
  if (D.theme === 2) { vt.classList.add('vl'); return; }
  const s = getComputedStyle(document.documentElement);
  const lum = n => { let v = s.getPropertyValue(n).replace(/[^0-9a-f]/gi, ''); if (v.length < 6) return -1;
    v = v.length === 8 && /^ff/i.test(v) ? v.slice(2) : v.slice(0, 6); const c = parseInt(v, 16); return 0.299 * (c >> 16) + 0.587 * (c >> 8 & 255) + 0.114 * (c & 255); };
  const b = lum('--card-color'), f = lum('--content-color');
  vt.classList.toggle('vl', b < 0 ? matchMedia('(prefers-color-scheme: light)').matches : b >= (f < 0 ? 128 : f));
}
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.p) { D.on = b.dataset.p === '1'; render(); act('Power', D.on); }
  else if (b.dataset.a) { D.auto = !D.auto; render(); act('Automatic', D.auto); }
});
function handleMessage(data) { D = typeof data === 'string' ? JSON.parse(data) : data; theme(); render(); }
if (D) { theme(); render(); }
</script>
</body>
</html>
